<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign-Up — TUGON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/login.css" />
  <link rel="icon" href="../assets/icons/icon.png" type="image/png" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <img src="../assets/icons/icon.png" alt="Icon" class="nav-icon" />
    </div>
    <div class="nav-links-right">
      <span class="nav-login-text">SIGN-UP</span>
    </div>
  </nav>

  <main class="page-content">
    <div class="login-page">

      <div class="login-visual page-fade">
        <div class="hero-glow"></div>
        <img src="../assets/icons/tugon_logo.png" alt="TUGON Logo" class="login-visual-logo" />
        <h1 class="visual-heading">Join the Event</h1>
        <p class="visual-subtext">
          Sign-up now to secure your spot and be part of an unforgettable campus experience.
        </p>
      </div>

      <div class="login-form-wrap">
        <div class="form-card page-fade">
          <h2>Sign-Up</h2>
          <p class="subtitle">Fill in the details below to create your account</p>

          <form id="signup-form" novalidate>

            <div class="form-row">
              <div class="form-group">
                <label for="signup-fname">FIRST NAME *</label>
                <input type="text" id="signup-fname" name="first_name" placeholder="Joshua" required />
              </div>
              <div class="form-group">
                <label for="signup-lname">LAST NAME *</label>
                <input type="text" id="signup-lname" name="last_name" placeholder="Bautista" required />
              </div>
            </div>

            <div class="form-group">
              <label for="signup-email">EMAIL ADDRESS *</label>
              <input type="email" id="signup-email" name="email" placeholder="bautista_joshua@plpasig.edu.ph" required />
            </div>

            <div class="form-group">
              <label for="signup-password">PASSWORD *</label>
              <input type="password" id="signup-password" name="password" placeholder="••••••" required />
            </div>

            <div class="form-group">
              <label for="signup-studentid">STUDENT ID *</label>
              <input type="text" id="signup-studentid" name="student_id" placeholder="24-12345" required inputmode="numeric" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="signup-college">COLLEGE *</label>
                <select id="signup-college" name="college" required>
                  <option value="" disabled selected hidden>-Select College-</option>
                  <option value="Arts and Science">Arts and Science</option>
                  <option value="Business and Accountancy">Business and Accountancy</option>
                  <option value="Computer Studies">Computer Studies</option>
                  <option value="Education">Education</option>
                  <option value="Engineering">Engineering</option>
                  <option value="Hospitality Management">Hospitality Management</option>
                  <option value="Nursing">Nursing</option>
                </select>
              </div>
              <div class="form-group">
                <label for="signup-year">YEAR LEVEL *</label>
                <select id="signup-year" name="year_level" required>
                  <option value="" disabled selected hidden>-Select Year-</option>
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                </select>
              </div>
            </div>

            <div class="form-row cascade-row" id="course-row">
              <div class="form-group form-group-full">
                <label for="signup-course">COURSE *</label>
                <select id="signup-course" name="course">
                  <option value="">-- Select Course --</option>
                </select>
              </div>
            </div>

            <div class="form-row cascade-row" id="major-row">
              <div class="form-group form-group-full">
                <label for="signup-major">MAJOR *</label>
                <select id="signup-major" name="major">
                  <option value="">-- Select Major --</option>
                  <option value="English">English</option>
                  <option value="Filipino">Filipino</option>
                  <option value="Mathematics">Mathematics</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">Sign Up &rarr;</button>
          </form>

          <div class="create-account">
            Already have an account? <a href="login.html">Login here</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 TUGON School Event System
  </footer>

  <script src="../scripts/signup.js"></script>
  
</body>
</html>
