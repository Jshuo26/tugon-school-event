<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — TUGON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../styles/admin_dashboard.css" />
  <link rel="icon" href="../assets/icons/icon.png" type="image/png" />
</head>
<body>
  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">
  <label for="sidebar-toggle" class="sidebar-overlay"></label>
  <label for="sidebar-toggle" class="sidebar-hamburger" aria-label="Toggle Menu">
    <span></span><span></span><span></span>
  </label>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/icons/icon.png" alt="Icon" />
      <span>TUGON</span>
    </div>

    <ul class="nav-menu">
      <li class="nav-item">
        <a href="admin_dashboard.html" class="nav-link active">
          <span>Events</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="add_event.html" class="nav-link">
          <span>Add Event</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="registrations.html" class="nav-link">
          <span>Registrations</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <a href="login.html" class="nav-link">
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <header class="header-section">
      <div class="header-text">
        <h1>Manage & Pin Events</h1>
        <p>Only one event can be pinned as Featured at a time. All-college events are visible to everyone; college-specific events are visible only to that college's students.</p>
      </div>

      <div class="user-profile">
        <span>Admin Portal</span>
      </div>
    </header>

    <div class="dashboard-tabs" id="dashboard-tabs">
      <button class="tab-btn active" data-college="All">All Colleges</button>
      <button class="tab-btn" data-college="Arts and Science">Arts and Science</button>
      <button class="tab-btn" data-college="Business and Accountancy">Business and Accountancy</button>
      <button class="tab-btn" data-college="Computer Studies">Computer Studies</button>
      <button class="tab-btn" data-college="Education">Education</button>
      <button class="tab-btn" data-college="Engineering">Engineering</button>
      <button class="tab-btn" data-college="Hospitality Management">Hospitality Management</button>
      <button class="tab-btn" data-college="Nursing">Nursing</button>
    </div>

    <div class="year-filters" id="year-filters">
      <button class="year-btn active" data-year="All">All Years</button>
      <button class="year-btn" data-year="1st Year">1st Year</button>
      <button class="year-btn" data-year="2nd Year">2nd Year</button>
      <button class="year-btn" data-year="3rd Year">3rd Year</button>
      <button class="year-btn" data-year="4th Year">4th Year</button>
    </div>

    <div class="events-grid" id="events-grid">
      <p id="events-loading">Loading events…</p>
    </div>

  </main>
  <script src="../scripts/shared_admin.js"></script>
  <script src="../scripts/admin_dashboard.js"></script>
</body>
</html>
